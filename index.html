    <!-- Предотвращение мигания не той темы при загрузке страницы (Anti-FOUC) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ijarauz-admin-theme');
          var isDark =
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Статический лоадер — отображается до инициализации React бандла, скрывается автоматически -->
    <div id="static-loader" style="
      position:fixed;inset:0;z-index:99999;
      display:flex;align-items:center;justify-content:center;
      --sl-bg:#faf9f7;--sl-border:#e5e3df;--sl-accent:#244fc7;
      background-color:var(--sl-bg);
      transition:opacity 0.25s ease;
    ">
      <div style="text-align:center;display:flex;flex-direction:column;align-items:center">
        <div style="margin-top:16px;font-size:18px;font-weight:600;letter-spacing:.18em;color:inherit;font-family:Inter,'Segoe UI',system-ui,sans-serif">AVERON</div>
        <div style="
          margin-top:16px;width:28px;height:28px;border-radius:50%;
          border:2px solid var(--sl-border,#e5e3df);border-top-color:var(--sl-accent,#244fc7);
          animation:sl-spin .7s linear infinite;
        "></div>
      </div>
    </div>
    <style>
      @keyframes sl-spin{to{transform:rotate(360deg)}}
      .dark #static-loader{--sl-bg:#111315;--sl-border:#30353c;--sl-accent:#8ea5ff;color:#f2f3f3}
      #static-loader{--sl-bg:#faf9f7;--sl-border:#e5e3df;--sl-accent:#244fc7;color:#202124}
    </style>
    <script>
      // Удаляем статический лоадер после монтирования React
      (function(){
        var el=document.getElementById('static-loader');
        if(!el)return;
        // React вызывает hydrate/render → DOM меняется → слушаем DOMContentLoaded + небольшую задержку
        function hide(){el.style.opacity='0';setTimeout(function(){el.remove()},260);}
        if(document.readyState==='loading'){
          document.addEventListener('DOMContentLoaded',function(){setTimeout(hide,50)});
        }else{setTimeout(hide,50);}
        // Гарантированно удаляем через 5 секунд в случае ошибки
        setTimeout(function(){if(el.parentNode)el.remove()},5000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
